server:
    port: 8084

spring:
    datasource:
        url: jdbc:h2:mem:beer
        driverClassName: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        generate-ddl: true
        show-sql: true
        defer-datasource-initialization: false
        properties:
            hibernate:
                jdbc:
                    lob:
                    non_contextual_creation: true
        open-in-view: false
    hibernate:
        ddl-auto: update
    liquibase:
        change-log: classpath:liquibase/changelog-master.xml
